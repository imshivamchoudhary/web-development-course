<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters -CodeVerseShivam</title>
    <style>
        .cont {}

        .img1 {
            filter: blur(9px);
        }
        .img2{
            filter: brightness(100%);
        }
        .img3{
            filter: contrast(2);
            filter: grayscale(90%);
        }
    </style>
</head>

<body>
    <div class="cont">
        <img class="img1" src="https://images.unsplash.com/photo-1727453000372-4f351184d509?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHx0b3BpYy1mZWVkfDR8eEh4WVRNSExnT2N8fGVufDB8fHx8fA%3D%3D"
            alt="">
        <img class="img2" src="https://plus.unsplash.com/premium_photo-1690407617542-2f210cf20d7e?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
            alt="">
        <img class="img3" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fHBlcnNvbnxlbnwwfHwwfHx8MA%3D%3D"
            alt="">
    </div>
</body>

</html>
