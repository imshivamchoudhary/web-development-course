<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid -CodeVerseShivam</title>
    <style>
        .con{
            border: 2px solid black;
            height: 70vh;
            display: grid;
            grid-template-areas: "nav nav nav"
                                 "side article article"
                                 "footer footer footer";
           }
        .items{
            border:2px solid blue;
            height: 32px;
        
        }
        .item-1{
            grid-area: nav;
            background-color: lightblue;
        }
        .item-2{
            grid-area: side;
            background-color: rgb(131, 166, 166);
        }
        .item-3{
            grid-area: article;
        }
        .item-4{
            grid-area: footer;
        }
        .item-5{
            grid-area: nav;
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="items item-1">1</div>
        <div class="items item-2">2</div>
        <div class="items item-3">3</div>
        <div class="items item-4">4</div>
        <div class="items item-5">5</div>
    </div>
</body>
</html>
