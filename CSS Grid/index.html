<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid -CodeVerseShivam</title>
    <style>
        .con{
            width: 80vw;
            border: 2px solid black;
            height: 70vh;
            display: grid;
            /* grid-template-columns: [pehla] 100px [dusra] 120px [t];
            grid-template-rows: 100px 100px 100px; */
            /* grid-template-columns: 1fr 1fr 1fr; */
            grid-template-columns: repeat(3,1fr);
            gap: 34px;
            justify-items: center;
            align-items: center;
        }
        .items{
            border:2px solid blue;
            height: 32px;
            width: 32px;
            /* background-color: aqua; */
        }
        .item-5{
            /* grid-row: 1/2; */
            /* or you can do 
            grid-row-start: 1;
            grid-row-end: 2;
            /* same thing */
            /* grid-column: pehla/t; */ 
        }
        .item-1{
            /* grid-row: 1/2;
            grid-column: 1/2; */
        }
    </style>
</head>
<body>
    <div class="con">
        <div class="items item-1">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items item-5">5</div>
    </div>
</body>
</html>
