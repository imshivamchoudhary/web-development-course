<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries -CodeVerseShivam </title>
    <style>
        body{
            background-color: blueviolet;
        }
        @media screen and (max-width:650px) {
            body{
                background-color: aqua;
            }
            .boxes{
                flex-direction: column;
            }
        }

        .boxes{
            display: flex;
        }

        .box{
            width: 344px;
            height: 344px;
            background-color: aquamarine;
            padding: 3px;
            margin: 3px;
        }
    </style>
</head>
<body>
    <div> 
        Media query is used to make a responsive
        design.
        <div>
            <p>for example i have 2 box</p>
        </div>
        <div class="boxes">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>
</html>
